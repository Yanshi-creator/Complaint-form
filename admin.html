<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heena Admin Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 10px; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 6px solid #007bff; position: relative; }
        .tech-badge { background: #e3f2fd; color: #007bff; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 10px; display: inline-block; }
        .shop-info { color: #d32f2f; font-weight: bold; font-size: 15px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; font-size: 14px; }
        .problem-box { background: #fff9c4; padding: 12px; border-radius: 8px; border-left: 5px solid #fbc02d; margin-top: 10px; }
        .wa-btn { background: #25D366; color: white; text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 8px; margin-top: 15px; font-weight: bold; }
        .done-btn { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; position: absolute; top: 15px; right: 15px; }
    </style>
</head>
<body>

    <h2 style="text-align:center;">Staff Portal</h2>
    <div id="complaintList" style="max-width: 500px; margin: auto;">Loading Data...</div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxkdcbimAHY0S2pUqb4vBnRJrXewJGV2vlzXSUUxwaweCkMV6jjieSCj9MxzF29o5pA/exec';

        async function load() {
            const resp = await fetch(scriptURL + "?action=read");
            const data = await resp.json();
            let html = "";
            data.forEach(item => {
                const waMsg = `*JOB DETAILS*%0A*Tech:* ${item.tech}%0A*Shop:* ${item.dealer}%0A*Customer:* ${item.name}%0A*Phone:* ${item.phone}%0A*Address:* ${item.address}%0A*Issue:* ${item.problem}`;

                html += `
                <div class="card">
                    <button class="done-btn" onclick="markDone(${item.row})">Mark Done</button>
                    <span class="tech-badge">👤 Technician: ${item.tech || 'Waiting...'}</span>
                    
                    <div class="shop-info">🏪 Shop/Dealer: ${item.dealer || 'Direct'}</div>
                    <h3 style="margin:5px 0;">${item.name}</h3>
                    <div style="color:#007bff; font-weight:bold;">📞 ${item.phone}</div>
                    
                    <div class="info-grid">
                        <div><b>Brand:</b> ${item.brand}</div>
                        <div><b>Model:</b> ${item.model}</div>
                        <div><b>Pincode:</b> ${item.pincode}</div>
                    </div>

                    <div style="font-size:14px; margin-bottom:10px;"><b>Address:</b> ${item.address}</div>

                    <div class="problem-box">
                        <small>CUSTOMER PROBLEM:</small><br>
                        <strong>${item.problem}</strong>
                    </div>

                    <a href="https://wa.me/?text=${waMsg}" target="_blank" class="wa-btn">📲 Forward to WhatsApp</a>
                </div>`;
            });
            document.getElementById('complaintList').innerHTML = html || "No Pending Complaints!";
        }

        async function markDone(row) {
            if(!confirm("Mark job as completed?")) return;
            await fetch(scriptURL + "?action=complete&row=" + row);
            alert("Excel Updated!");
            load();
        }
        load();
    </script>
</body>
</html>
