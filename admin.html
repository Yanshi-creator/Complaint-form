<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard | Rama Electronics</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 10px; margin: 0; }
        .header { background: #004085; color: white; padding: 15px; text-align: center; margin-bottom: 20px; }
        
        .tech-section { background: #343a40; color: white; padding: 10px; border-radius: 8px; margin: 25px 0 10px 0; text-transform: uppercase; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .count-badge { background: #ffc107; color: #000; padding: 2px 8px; border-radius: 10px; font-weight: bold; font-size: 12px; }
        
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-top: 5px solid #007bff; position: relative; }
        .status-Completed { border-top-color: #28a745; opacity: 0.8; background: #f9fff9; } /* Light Green */
        .status-Incomplete { border-top-color: #dc3545; opacity: 0.8; background: #fff5f5; } /* Light Red */
        
        .time-badge { font-size: 11px; color: #666; font-weight: bold; margin-bottom: 5px; display: block; }
        .shop-tag { color: #d32f2f; font-weight: bold; display: block; margin: 5px 0; font-size: 14px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; font-size: 13px; background: #f8f9fa; padding: 8px; border-radius: 6px; }
        .prob-box { background: #fff9c4; padding: 10px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #fbc02d; font-size: 14px; }
        
        .remark-box { width: 100%; padding: 10px; margin-top: 15px; border: 2px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; font-family: sans-serif; resize: vertical; }
        .btn-row { display: flex; gap: 8px; margin-top: 10px; }
        .c-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: bold; font-size: 14px; }
        .wa-btn { background: #25D366; color: white; text-decoration: none; display: block; text-align: center; padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: bold; font-size: 13px; }
        .empty-msg { text-align: center; color: #888; font-style: italic; padding: 15px; background: #fff; border-radius: 8px; border: 1px dashed #ccc; }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="margin:0;">RAMA ELECTRONICS</h2>
        <div style="font-size:11px; opacity:0.8; text-transform: uppercase;">Task Manager & Tech Remarks</div>
    </div>

    <div id="dashboard" style="max-width: 550px; margin: auto;">
        <div class="tech-section">👤 Santosh Bhai <span class="count-badge" id="count-santosh">0</span></div>
        <div id="list-santosh"></div>

        <div class="tech-section">👤 Rakesh Bhai <span class="count-badge" id="count-rakesh">0</span></div>
        <div id="list-rakesh"></div>

        <div class="tech-section">👤 Ajay Bhai <span class="count-badge" id="count-ajay">0</span></div>
        <div id="list-ajay"></div>

        <div class="tech-section">❓ Others/Unassigned <span class="count-badge" id="count-others">0</span></div>
        <div id="list-others"></div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz_8aNEGEXTcirCAls38sdCtP0xm5UFEBA_E4oXteOyPcREQC6e0AFXWQpwze54lX7l/exec';

        async function load() {
            try {
                const resp = await fetch(scriptURL + "?action=read");
                const data = await resp.json();
                const today = new Date().toLocaleDateString();

                const lists = { santosh: document.getElementById('list-santosh'), rakesh: document.getElementById('list-rakesh'), ajay: document.getElementById('list-ajay'), others: document.getElementById('list-others') };
                const counts = { santosh: 0, rakesh: 0, ajay: 0, others: 0 };
                Object.values(lists).forEach(l => l.innerHTML = "");

                data.forEach(item => {
                    const isPending = item.status === "Open";
                    const itemDate = new Date(item.date);
                    const timeStr = itemDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const dateStr = itemDate.toLocaleDateString();
                    
                    const msg = `*RAMA ELECTRONICS*%0A*Customer:* ${item.name}%0A*Phone:* ${item.phone}%0A*Issue:* ${item.problem}`;
                    
                    // Logic to display correct icon and text for completed vs incomplete
                    const statusIcon = item.status === "Completed" ? "✅ COMPLETED" : "❌ INCOMPLETE/CANCELLED";
                    const statusColor = item.status === "Completed" ? "green" : "#dc3545";

                    const cardHtml = `
                    <div class="card status-${item.status}">
                        <span class="time-badge">🕒 Logged: ${dateStr} | ${timeStr}</span>
                        ${!isPending ? `<b style="float:right; color:${statusColor}; font-size:12px;">${statusIcon}</b>` : ''}
                        
                        <span class="shop-tag">🏪 Dealer Shop: ${item.dealer || 'Direct Customer'}</span>
                        <h3 style="margin:5px 0; font-size: 18px;">${item.name}</h3>
                        <b style="color:#007bff; font-size:1.1em;">📞 ${item.phone}</b>
                        
                        <div class="info-grid">
                            <div><b>Brand:</b> ${item.brand || 'N/A'}</div>
                            <div><b>Model:</b> ${item.model || 'N/A'}</div>
                            <div><b>Pincode:</b> ${item.pincode}</div>
                        </div>
                        <p style="font-size:14px; margin: 10px 0;"><b>Address:</b> ${item.address}</p>

                        <div class="prob-box">
                            <small style="color:#888;">CUSTOMER ISSUE:</small><br>
                            <strong>${item.problem}</strong>
                        </div>

                        ${isPending ? `
                            <textarea id="rem-${item.row}" class="remark-box" rows="2" placeholder="Tech Notes: What was done? Or why is it incomplete?"></textarea>
                            <div class="btn-row">
                                <button class="c-btn" style="background:#28a745" onclick="update(event, '${item.row}', 'Completed')">Complete</button>
                                <button class="c-btn" style="background:#dc3545" onclick="update(event, '${item.row}', 'Incomplete')">Incomplete/Cancel</button>
                            </div>
                            <a href="https://wa.me/?text=${msg}" target="_blank" class="wa-btn">📲 WhatsApp Text</a>
                        ` : `
                            <div style="margin-top:15px; font-size:14px; background:#e9ecef; padding:10px; border-radius:6px; border-left: 4px solid ${statusColor};">
                                <small style="color:#666;">TECHNICIAN REMARKS:</small><br>
                                <b>${item.remarks || 'No remarks provided.'}</b>
                            </div>
                        `}
                    </div>`;

                    const tech = (item.tech || "").toUpperCase();
                    if (tech.includes("SANTOSH")) { lists.santosh.innerHTML += cardHtml; counts.santosh++; }
                    else if (tech.includes("RAKESH")) { lists.rakesh.innerHTML += cardHtml; counts.rakesh++; }
                    else if (tech.includes("AJAY")) { lists.ajay.innerHTML += cardHtml; counts.ajay++; }
                    else { lists.others.innerHTML += cardHtml; counts.others++; }
                });

                for (let key in counts) {
                    document.getElementById('count-' + key).innerText = counts[key];
                    if (counts[key] === 0) lists[key].innerHTML = '<div class="empty-msg">No entries for this group.</div>';
                }
            } catch (e) { console.error("Error loading data", e); }
        }

        async function update(event, row, status) {
            const remark = document.getElementById('rem-' + row).value.trim();
            if(!remark) {
                alert("Please type your remarks/notes before submitting!");
                return;
            }
            if(!confirm(`Mark this job as ${status}?`)) return;
            
            // Disable button while saving to prevent double-clicks
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "Saving...";
            btn.disabled = true;

            try {
                await fetch(`${scriptURL}?action=updateStatus&row=${row}&status=${status}&remarks=${encodeURIComponent(remark)}`);
                alert("Report Saved Successfully!");
                load();
            } catch (err) {
                alert("Error saving report. Please check your internet connection.");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        load();
        setInterval(load, 180000); // Auto-refresh every 1 mins
    </script>
</body>
</html>
