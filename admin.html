<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 10px; }
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-top: 5px solid #007bff; position: relative; }
        .done { opacity: 0.7; border-top-color: #28a745; background: #f9fff9; }
        .tech-badge { background: #e3f2fd; color: #007bff; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .shop-tag { color: #d32f2f; font-weight: bold; display: block; margin: 5px 0; }
        .prob { background: #fff9c4; padding: 10px; border-radius: 8px; margin-top: 10px; border-left: 4px solid #fbc02d; }
        .wa-btn { background: #25D366; color: white; text-decoration: none; display: block; text-align: center; padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: bold; }
        .done-btn { background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 6px; position: absolute; top: 15px; right: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Daily Complaint Log</h2>
    <div id="list">Loading...</div>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbyi2iLnq4hc-r-PAVE6MqMBNNG_MHQ_KyUjtJ6KBGRRYyWTlJM-7eIsiJJDtGWcZKTR/exec';

        async function load() {
            const resp = await fetch(url + "?action=read");
            const data = await resp.json();
            const today = new Date().toLocaleDateString();
            let html = "";

            data.forEach(item => {
                const itemDate = new Date(item.date).toLocaleDateString();
                // ONLY SHOWS ENTRIES FROM TODAY
                if (itemDate === today) {
                    const isDone = item.status === "Completed";
                    const msg = `*JOB*%0A*Tech:* ${item.tech}%0A*Shop:* ${item.dealer}%0A*Customer:* ${item.name}%0A*Phone:* ${item.phone}%0A*Issue:* ${item.problem}`;
                    
                    html += `<div class="card ${isDone ? 'done' : ''}">
                        ${isDone ? '<b style="color:green; float:right;">✅ COMPLETED</b>' : `<button class="done-btn" onclick="mark('${item.row}')">Mark Done</button>`}
                        <span class="tech-badge">👤 Tech: ${item.tech}</span>
                        <span class="shop-tag">🏪 Shop: ${item.dealer || 'Direct'}</span>
                        <h3 style="margin:5px 0;">${item.name}</h3>
                        <b style="color:#007bff; font-size:1.1em;">📞 ${item.phone}</b>
                        <p style="font-size:14px;"><b>Model:</b> ${item.brand} ${item.model}<br><b>Area:</b> ${item.pincode}</p>
                        <div class="prob"><b>Problem:</b> ${item.problem}</div>
                        ${!isDone ? `<a href="https://wa.me/?text=${msg}" target="_blank" class="wa-btn">📲 WhatsApp Dispatch</a>` : ''}
                    </div>`;
                }
            });
            document.getElementById('list').innerHTML = html || "No entries for today.";
        }

        async function mark(row) {
            if(!confirm("Mark this job as completed?")) return;
            await fetch(url + "?action=complete&row=" + row);
            load();
        }
        load();
    </script>
</body>
</html>
