        label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; }
        .sub-label { font-weight: normal; font-size: 12px; color: #666; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 15px; border: none; width: 100%; font-size: 18px; font-weight: bold; border-radius: 6px; margin-top: 25px; cursor: pointer; transition: 0.3s;}
        button:disabled { background: #6c757d; cursor: not-allowed; }
        .heena-badge { background: #f8d7da; color: #dc3545; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; display: inline-block; margin-top: 5px; }

            <input type="text" name="brand" placeholder="Brand" required>
            <input type="text" name="modelNumber" placeholder="Model No" required>
        </div>

        <label>Dealer Shop Name * <span class="sub-label">(Type NA if not applicable)</span></label>
        <input type="text" name="dealerName" required>
        
        <input type="hidden" name="complaintNo" id="cNoField">
        
        <button type="submit" id="subBtn">Submit Complaint</button>
    </form>
</div>
<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycby-dCz98IG73h7gWufYxeXJQUUo9XG-wdcPgNzGqoOYfE-x-6Wa68feDkKzluQbXBQi/exec';
    const ADMIN_WHATSAPP = "919624870096"; 
    const DASHBOARD_LINK = "https://yanshi-creator.github.io/Complaint-form/admin.html";

    function checkOtherArea() {
        var dropdown = document.getElementById("areaDropdown");
        var otherInput = document.getElementById("areaOther");
        if (dropdown.value === "Other") {
            otherInput.style.display = "block";
            otherInput.required = true;
        } else {
            otherInput.style.display = "none";
            otherInput.required = false;
        }
    }

    const form = document.getElementById('complaintForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        
        const btn = document.getElementById('subBtn');
        btn.innerText = "Checking Details...";
        btn.disabled = true;

        const dropdownVal = document.getElementById('areaDropdown').value;
        const otherVal = document.getElementById('areaOther').value;
        const finalAreaLocation = (dropdownVal === "Other") ? otherVal : dropdownVal;
        
        document.getElementById('areaField').value = finalAreaLocation;

        // UPDATED: Generates a truly unique ID using the current time + random numbers
        // This ensures the Google Apps Script will never confuse two complaints
        const timePart = Date.now().toString().slice(-4); 
        const randomPart = Math.floor(1000 + Math.random() * 9000);
        const newComplaintNo = "RMA-" + timePart + "-" + randomPart;
        
        document.getElementById('cNoField').value = newComplaintNo;
        
        fetch(scriptURL, { method: 'POST', body: new FormData(form) })
        .then(response => response.json())
        .then(data => { 
            if (data.result === "Duplicate") {
                alert("⚠️ DUPLICATE COMPLAINT DETECTED ⚠️\n\nA complaint for this Customer Name and Problem was already submitted in the last 24 hours.");
                btn.innerText = "Submit Complaint";
                btn.disabled = false;
            } else {
                alert("Success! Your complaint is registered.\n\nYour Complaint No: " + newComplaintNo); 
                
                const waMessage = `NEW - ${newComplaintNo} - ${finalAreaLocation}\n${DASHBOARD_LINK}`;
                const waLink = `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(waMessage)}`;
                window.open(waLink, '_blank'); 

                form.reset();
                document.getElementById('areaOther').style.display = "none";
                document.getElementById('areaOther').required = false;
                
                btn.innerText = "Submit Complaint";
                btn.disabled = false;
            }
        })
        .catch(error => {
            alert("An error occurred. Please try again.");
            btn.innerText = "Submit Complaint";
            btn.disabled = false;
        });
    });
</script>
