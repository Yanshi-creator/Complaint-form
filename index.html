<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rama Electronics - Service Form</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .logo-section { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 15px; border: none; width: 100%; font-size: 18px; font-weight: bold; border-radius: 6px; margin-top: 25px; cursor: pointer; }
        .heena-badge { background: #f8d7da; color: #dc3545; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-section">
        <h1 style="margin:0; color:#004085;">RAMA</h1>
        <p style="margin:0; font-size:14px; color:#666; text-transform:uppercase; letter-spacing:1px;">Electronics Service</p>
        <div class="heena-badge">A UNIT OF: HEENA ELECTRONICS PVT LTD</div>
    </div>

    <form id="complaintForm">
        <label>Complaint From *</label>
        <select name="userType">
            <option value="Customer">Direct Customer</option>
            <option value="Shop">Shop / Dealer</option>
        </select>
        
        <label>Customer Name *</label>
        <input type="text" name="name" placeholder="Full Name" required>
        
        <label>Phone Number *</label>
        <input type="tel" name="phone" placeholder="Mobile Number" required>
        
        <label>Full Address *</label>
        <textarea name="address" rows="2" placeholder="House No, Area, Landmark" required></textarea>
        
        <label>Pincode *</label>
        <input type="text" name="pincode" placeholder="6-digit Pincode" required>
        
        <label>Device Brand</label>
        <input type="text" name="brand" placeholder="e.g. Voltas, Samsung">

        <label>Model Name/Number</label>
        <input type="text" name="model" placeholder="e.g. 1.5 Ton Split">

        <label>Problem Details (Issue)</label>
        <textarea name="problem" placeholder="Describe the fault here (e.g. Not cooling)"></textarea>
        
        <label>Dealer Shop Name (If any)</label>
        <input type="text" name="dealerName" placeholder="e.g. Heena Electronics">
        
        <label>Dealer Contact</label>
        <input type="text" name="dealerContact" placeholder="Dealer phone number">
        
        <button type="submit" id="submitBtn">Submit Complaint</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbx6nR-yRFeQ3InrKpBh2HBTXdrRLEcmQSkaQ_qeDidC2ZUJaMM8Zsana_Kk6T5QQ_g5/exec';
    const form = document.getElementById('complaintForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('submitBtn').innerText = "Submitting Data...";
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(() => { 
            alert("Complaint Registered Successfully! Our team will contact you soon."); 
            form.reset(); 
            location.reload(); 
        })
        .catch(() => alert("Error, please check internet and try again!"));
    });
</script>
</body>
</html>
