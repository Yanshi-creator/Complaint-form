<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rama Electronics | Service Request</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .logo { text-align: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 15px; }
        label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; }
        .sub-label { font-weight: normal; font-size: 12px; color: #666; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 15px; border: none; width: 100%; font-size: 18px; font-weight: bold; border-radius: 6px; margin-top: 25px; cursor: pointer; }
        .heena-badge { background: #f8d7da; color: #dc3545; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; display: inline-block; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1 style="margin:0; color:#004085;">RAMA</h1>
        <p style="margin:0; font-size:12px; color:#666; letter-spacing:1px; text-transform: uppercase;">Electronics Service</p>
        <div class="heena-badge">A UNIT OF HEENA ELECTRONICS PVT LTD</div>
    </div>
    <form id="complaintForm">
        <label>Complaint Type *</label>
        <select name="userType" required><option>Customer</option><option>Shop</option></select>
        
        <label>Customer Name *</label><input type="text" name="name" required>
        
        <label>Phone Number *</label><input type="tel" name="phone" required>
        
        <label>Full Address *</label><textarea name="address" required></textarea>
        
        <label>Pincode *</label><input type="text" name="pincode" required>
        
        <label>Device Details *</label>
        <div style="display:flex; gap:10px;">
            <input type="text" name="brand" placeholder="Brand" required>
            <input type="text" name="model" placeholder="Model" required>
        </div>
        
        <label>Problem Details *</label><textarea name="problem" placeholder="What is the issue?" required></textarea>
        
        <label>Dealer Shop Name * <span class="sub-label">(Type NA if not applicable)</span></label>
        <input type="text" name="dealerName" required>
        
        <button type="submit" id="subBtn">Submit Complaint</button>
    </form>
</div>
<script>
    // FIX: Added single quotes around the URL
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz_8aNEGEXTcirCAls38sdCtP0xm5UFEBA_E4oXteOyPcREQC6e0AFXWQpwze54lX7l/exec';
    
    const form = document.getElementById('complaintForm');
    form.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('subBtn').innerText = "Submitting...";
        
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => { 
            alert("Success! Your complaint is registered."); 
            form.reset(); // Added this to clear the form fields
            document.getElementById('subBtn').innerText = "Submit Complaint";
        })
        .catch(error => {
            alert("Error. Please check your internet connection.");
            document.getElementById('subBtn').innerText = "Submit Complaint";
            console.error('Error!', error.message);
        });
    });
</script>
</body>
</html>
